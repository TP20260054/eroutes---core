# Perfil de producción (SPRING_PROFILES_ACTIVE=prod). Sin este perfil, nada de esto aplica.

# --- Swagger / OpenAPI: apagados salvo que SWAGGER_ENABLED=true ---
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# --- Banderas de solo desarrollo/evaluación: apagadas ---
eroutes.routing.permitir-pesos-en-solicitud=false
# La propiedad real vive bajo eroutes.recalculo (RecalculoProperties), no bajo eroutes.routing
eroutes.recalculo.permitir-configuracion-en-solicitud=false

# --- Actuator: solo health, sin detalles ni componentes, con probes (liveness/readiness) ---
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,grafo

# --- Logging ---
logging.level.root=INFO
logging.level.org.springframework.security=WARN

# --- Otros ---
spring.devtools.restart.enabled=false
