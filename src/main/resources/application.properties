spring.application.name=eroutes
spring.config.import=optional:file:.env.local[.properties]
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024
eroutes.map.zona-nombre=San Isidro
eroutes.busqueda.limite-por-defecto=8
eroutes.busqueda.limite-maximo=20
eroutes.busqueda.radio-calle-m=60
eroutes.busqueda.radio-lugar-m=40

# --- Vehículos ---
eroutes.vehiculos.maximo-por-usuario=3

# --- Seguridad JWT ---
eroutes.seguridad.jwt-secreto=${JWT_SECRET}
eroutes.seguridad.jwt-expiracion-horas=168

# SOLO DESARROLLO: habilita endpoints de Swagger en producción desactivar
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# --- Ruteo ---
eroutes.routing.max-distancia-snap-m=200

# Tipos de vía excluidos para vehículos motorizados (vel > 25 km/h) # PROVISIONAL
eroutes.routing.tipos-via-excluidos-motorizado=footway,pedestrian,path,steps,corridor,bridleway,cycleway,motorway,motorway_link,trunk,trunk_link

# Tipos de vía excluidos para movilidad personal (vel <= 25 km/h) # PROVISIONAL
eroutes.routing.tipos-via-excluidos-personal=footway,pedestrian,path,steps,corridor,bridleway,motorway,motorway_link,trunk,trunk_link

# Velocidades por defecto por tipo de vía (km/h) # PROVISIONAL
eroutes.routing.vel-defecto.primary=50
eroutes.routing.vel-defecto.secondary=50
eroutes.routing.vel-defecto.tertiary=40
eroutes.routing.vel-defecto.unclassified=30
eroutes.routing.vel-defecto.residential=30
eroutes.routing.vel-defecto.living-street=20
eroutes.routing.vel-defecto.service=20
eroutes.routing.vel-defecto.otros=30
eroutes.routing.vel-defecto.minima=10

# Factor de velocidad efectiva (penalización por semáforos, tráfico, etc.) # PROVISIONAL, calibrar contra Google Maps modo moto
eroutes.routing.factor-velocidad-efectiva=0.75

# Demora por tipo de control del nodo destino (segundos) # PROVISIONAL, calibrar contra Google Maps modo moto
eroutes.routing.demora-nodo.traffic-signals=15
eroutes.routing.demora-nodo.stop=5
eroutes.routing.demora-nodo.crossing=2
eroutes.routing.demora-nodo.sin-control=1

# Exposición base por tipo de vía # PROVISIONAL
eroutes.routing.exposicion.primary=1.0
eroutes.routing.exposicion.secondary=0.8
eroutes.routing.exposicion.tertiary=0.5
eroutes.routing.exposicion.unclassified=0.35
eroutes.routing.exposicion.residential=0.25
eroutes.routing.exposicion.living-street=0.1
eroutes.routing.exposicion.service=0.2
eroutes.routing.exposicion.otros=0.5

# Pesos función de costo multicriterio # PROVISIONAL
eroutes.routing.pesos.tiempo=1.0
eroutes.routing.pesos.distancia=1.0
eroutes.routing.pesos.exposicion=1.0
eroutes.routing.pesos.no-validado=0.5
eroutes.routing.pesos.cruce=5.0

# SOLO DESARROLLO: desactivar en producción
eroutes.routing.permitir-pesos-en-solicitud=true
